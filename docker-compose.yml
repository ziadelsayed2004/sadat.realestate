services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      API_HOST: 0.0.0.0
      API_PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/sadat?replicaSet=rs0
      AUTH_ACCESS_TOKEN_SECRET: "${AUTH_ACCESS_TOKEN_SECRET:?Set AUTH_ACCESS_TOKEN_SECRET to a local-only base64url secret}"
    ports:
      - "3000:3000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.API_PORT || '3000') + '/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mongo_data:/data/db

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mongosh --host mongo:27017/admin --quiet --eval
      "try { rs.status().ok } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }"

volumes:
  mongo_data:
