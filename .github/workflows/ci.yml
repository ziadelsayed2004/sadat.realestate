name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npm run env:check
        env:
          APP_ENV: test
          API_HOST: 127.0.0.1
          API_PORT: 3000
          MONGODB_URI: mongodb://127.0.0.1:27017/sadat_ci_contract_only

