<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sadat Real Estate web application shell" />
    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        const cookieLocale = document.cookie.match(/(?:^|;\s*)sadat-real-estate\.locale=(ar|en)(?:;|$)/)?.[1];
        const locale = params.get('lang') === 'en' || params.get('lang') === 'ar'
          ? params.get('lang')
          : cookieLocale === 'en' ? 'en' : 'ar';
        document.documentElement.lang = locale;
        document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
    <link rel="icon" type="image/png" href="/assets/sadat-real-estate-favicon.png" />
    <link rel="preload" href="/assets/fonts/cairo-v31-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/cairo-v31-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/fonts/cairo-v31.css" />
    <title>Sadat Real Estate</title>
  </head>
  <body>
    <div id="app"><!--ssr-outlet--></div>
    <script type="module" src="/src/features/frontend_foundation/entry-client.tsx"></script>
  </body>
</html>
